# One-command CQRS demo:
#   docker compose up --build
#
#   write-db  (Postgres, wal_level=logical)  <-- NestJS commands (TypeORM, pessimistic locks)
#   debezium  (Debezium Server)              <-- tails write-db WAL via pgoutput, publishes to Kafka
#   kafka     (Apache Kafka, KRaft)          <-- topics airline.public.airplanes / airline.public.seats
#   api       (NestJS)  kafkajs consumer     <-- projects events into the read DB; also serves commands + queries
#   read-db   (Postgres)                     <-- denormalized read models
services:
  write-db:
    image: postgres:17
    container_name: cqrs-write-db
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airline_write
    ports:
      - "5433:5432"
    volumes:
      - ./db/write:/docker-entrypoint-initdb.d:ro
      - write-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airline_write"]
      interval: 5s
      timeout: 5s
      retries: 20

  read-db:
    image: postgres:17
    container_name: cqrs-read-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airline_read
    ports:
      - "5434:5432"
    volumes:
      - ./db/read:/docker-entrypoint-initdb.d:ro
      - read-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airline_read"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    container_name: cqrs-kafka
    environment:
      # Single-node KRaft (no ZooKeeper). Two listeners: one for containers, one for the host.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "29092:29092" # host access, e.g. kcat -b localhost:29092 -t airline.public.seats -C
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  api:
    build: ./api
    container_name: cqrs-api
    environment:
      PORT: "3000"
      WRITE_DB_URL: postgres://postgres:postgres@write-db:5432/airline_write
      READ_DB_URL: postgres://postgres:postgres@read-db:5432/airline_read
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: airline-read-model-projector
    ports:
      - "3000:3000"
    depends_on:
      write-db:
        condition: service_healthy
      read-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  debezium:
    image: quay.io/debezium/server:3.1
    container_name: cqrs-debezium
    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties:ro
      - debezium-data:/debezium/data
    ports:
      - "8089:8080" # http://localhost:8089/q/health
    depends_on:
      write-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # NOTE: no dependency on `api`. Debezium only needs the WAL and the broker.

volumes:
  write-db-data:
  read-db-data:
  kafka-data:
  debezium-data:
