# ---- Sink: publish every change event to Kafka ----
# Topic name = <topic.prefix>.<schema>.<table>, e.g. airline.public.seats
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=kafka:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.acks=all
debezium.sink.kafka.producer.enable.idempotence=true

# ---- Source: Postgres logical replication (pgoutput plugin, built into Postgres) ----
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=write-db
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=airline_write
debezium.source.topic.prefix=airline
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_airline
debezium.source.publication.name=dbz_airline_publication
debezium.source.publication.autocreate.mode=filtered
debezium.source.schema.include.list=public
debezium.source.table.include.list=public.airplanes,public.seats

# Snapshot existing rows on first start, then stream the WAL.
debezium.source.snapshot.mode=initial
# Emit a single "d" event per delete (no Kafka-style tombstone record).
debezium.source.tombstones.on.delete=false
# numeric(10,2) -> JSON number instead of base64-encoded bytes.
debezium.source.decimal.handling.mode=double

# Where Debezium remembers how far into the WAL it has read (survives restarts).
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0

# ---- Payload format: plain JSON envelope {before, after, source, op, ts_ms} ----
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

quarkus.log.console.json=false
quarkus.log.level=INFO
